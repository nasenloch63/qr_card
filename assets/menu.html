<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Haze &amp; Chill · Speisekarte</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    @font-face{font-family:'Syne';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/Syne-SemiBold.ttf') format('truetype')}
    @font-face{font-family:'Syne';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/Syne-Bold.ttf') format('truetype')}
    @font-face{font-family:'Syne';font-style:normal;font-weight:800;font-display:swap;src:url('/fonts/Syne-ExtraBold.ttf') format('truetype')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/DMSans-Regular.ttf') format('truetype')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/DMSans-Medium.ttf') format('truetype')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/DMSans-SemiBold.ttf') format('truetype')}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/DMSans-Bold.ttf') format('truetype')}

    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --surface: rgba(255, 255, 255, 0.045);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.10);
      --border-soft: rgba(255, 255, 255, 0.06);
      --text: #faf5ff;
      --text-secondary: rgba(237, 233, 254, 0.78);
      --text-muted: rgba(221, 214, 254, 0.56);
      --emerald: #10b981;
      --emerald-light: #6ee7b7;
      --teal: #2dd4bf;
      --violet: #8b5cf6;
      --violet-light: #c4b5fd;
      --fuchsia-light: #f5d0fe;
      --rose: #fb7185;
      --font-display: 'Syne', system-ui, sans-serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100svh;
      font: 15px/1.5 var(--font-sans);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    ::selection {
      background: rgba(16, 185, 129, 0.30);
      color: #ffffff;
    }

    /* Ambient Haze & Chill atmosphere */
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 75% 45% at 15% 0%, rgba(139, 92, 246, 0.18), transparent 65%),
        radial-gradient(ellipse 65% 40% at 88% 8%, rgba(16, 185, 129, 0.14), transparent 60%),
        radial-gradient(ellipse 70% 45% at 50% 100%, rgba(16, 185, 129, 0.09), transparent 65%);
    }

    .watermark {
      position: fixed;
      top: 56px;
      left: 50%;
      width: min(460px, 110vw);
      height: min(460px, 110vw);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.035;
      background: linear-gradient(135deg, var(--violet-light), var(--emerald-light));
      -webkit-mask-image: url('/logo.svg');
      mask-image: url('/logo.svg');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }

    /* Sticky frosted header matching haze-chill.com */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 10, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .topbar-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      background: linear-gradient(115deg, var(--violet-light), var(--fuchsia-light) 48%, var(--emerald-light));
      -webkit-mask-image: url('/logo.svg');
      mask-image: url('/logo.svg');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.45)) drop-shadow(0 0 18px rgba(16, 185, 129, 0.2));
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      min-width: 0;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #ffffff;
    }

    .brand-sub {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(110, 231, 183, 0.85);
      margin-top: 2px;
    }

    .table-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(52, 211, 153, 0.35);
      background: rgba(16, 185, 129, 0.12);
      color: var(--emerald-light);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.14);
    }

    .table-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--teal);
      box-shadow: 0 0 8px rgba(45, 212, 191, 0.9);
    }

    /* Main content container */
    main {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 26px 18px 96px;
    }

    .hero {
      text-align: center;
      padding: 8px 6px 26px;
    }

    .eyebrow {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--emerald-light);
      margin: 0 0 10px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(32px, 8.5vw, 48px);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.025em;
      background: linear-gradient(95deg, #6ee7b7 0%, #99f6e4 46%, #c4b5fd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 28px rgba(16, 185, 129, 0.28));
    }

    .hero-sub {
      margin: 10px auto 0;
      max-width: 420px;
      font-size: 14.5px;
      color: var(--text-secondary);
    }

    /* Buttons base */
    button {
      cursor: pointer;
      color: inherit;
      font: inherit;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: transform 0.16s ease, border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid rgba(52, 211, 153, 0.85);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.42;
      cursor: default;
      transform: none !important;
    }

    /* Category Grid — inspired by haze-chill.com /links & #menu */
    #grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      min-height: 122px;
      padding: 16px;
      text-align: left;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.025));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .tile::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 100% 0%, var(--tile-glow, rgba(16, 185, 129, 0.14)), transparent 65%);
      opacity: 0.7;
      transition: opacity 0.22s ease;
      pointer-events: none;
    }

    .tile:hover {
      border-color: var(--tile-border, rgba(52, 211, 153, 0.45));
      background: rgba(255, 255, 255, 0.075);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .tile:active { transform: translateY(0) scale(0.99); }

    .tile-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tile-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cat-from, #10b981), var(--cat-to, #2dd4bf));
      color: #0a0a0a;
      box-shadow: 0 6px 18px var(--tile-shadow, rgba(16, 185, 129, 0.28));
      flex: 0 0 auto;
    }

    .tile-icon svg { width: 20px; height: 20px; }

    .tile-arrow {
      color: rgba(221, 214, 254, 0.45);
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .tile:hover .tile-arrow {
      color: #ffffff;
      transform: translate(2px, -2px);
    }

    .tile-meta {
      position: relative;
      z-index: 1;
    }

    .tile-title {
      display: block;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      line-height: 1.2;
    }

    .tile-count {
      display: block;
      margin-top: 3px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* Products View */
    #products {
      margin-top: 4px;
    }

    .cat-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    #back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 15px;
      border-radius: 999px;
      border: 1px solid rgba(167, 139, 250, 0.32);
      background: rgba(255, 255, 255, 0.05);
      color: #ede9fe;
      font-size: 13.5px;
      font-weight: 600;
    }

    #back:hover {
      border-color: rgba(52, 211, 153, 0.5);
      background: rgba(16, 185, 129, 0.12);
      color: #d1fae5;
    }

    .cat-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      width: 100%;
    }

    .cat-chip {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(221, 214, 254, 0.8);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .cat-chip:hover {
      border-color: rgba(52, 211, 153, 0.4);
      color: #ffffff;
    }

    .cat-chip.active {
      border-color: transparent;
      background: linear-gradient(135deg, var(--cat-from, #10b981), var(--cat-to, #2dd4bf));
      color: #0a0a0a;
      font-weight: 700;
      box-shadow: 0 0 16px var(--tile-shadow, rgba(16, 185, 129, 0.3));
    }

    /* Glass Panels matching site_menu.png */
    .panel {
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 20px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
    }

    .panel-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .panel-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cat-from, #10b981), var(--cat-to, #2dd4bf));
      color: #0a0a0a;
      flex: 0 0 auto;
    }
    .panel-icon svg { width: 17px; height: 17px; }

    h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #ede9fe;
    }

    /* Menu & Cart Rows */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-soft);
    }

    .row:last-child { border-bottom: 0; padding-bottom: 2px; }

    .row-info {
      min-width: 0;
      flex: 1;
    }

    .row-name {
      font-size: 15.5px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .row-price {
      display: block;
      margin-top: 3px;
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--emerald-light);
    }

    .row-sub {
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 12.5px;
      margin-left: 6px;
    }

    /* Stepper Controls */
    .step {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      flex: 0 0 auto;
    }

    .step.has-qty {
      border-color: rgba(52, 211, 153, 0.42);
      background: rgba(16, 185, 129, 0.10);
    }

    .step button {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.07);
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
      color: #ffffff;
    }

    .step button:hover:not(:disabled) {
      background: rgba(16, 185, 129, 0.25);
      border-color: rgba(52, 211, 153, 0.45);
      color: var(--emerald-light);
    }

    .step .step-plus:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--emerald), var(--teal));
      color: #0a0a0a;
      border-color: transparent;
    }

    .step-qty {
      min-width: 26px;
      text-align: center;
      font-family: var(--font-sans);
      font-size: 14.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .step.has-qty .step-qty { color: #ffffff; }

    /* Cart Panel */
    #cart-section {
      margin-top: 24px;
    }

    #cart-panel {
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    #cart-panel.has-items {
      border-color: rgba(52, 211, 153, 0.30);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 32px rgba(16, 185, 129, 0.08);
    }

    .cart-head-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .count-badge {
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.20);
      border: 1px solid rgba(167, 139, 250, 0.35);
      color: var(--violet-light);
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #total {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--emerald-light);
    }

    .empty-text {
      padding: 16px 0 6px;
      font-size: 14px;
      color: var(--text-muted);
      margin: 0;
    }

    /* Primary CTA Button — exact haze-chill.com emerald-teal gradient pill */
    #send {
      width: 100%;
      margin-top: 18px;
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--emerald), var(--teal));
      color: #0a0a0a;
      font-family: var(--font-sans);
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: 0.005em;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.35);
    }

    #send:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 0 34px rgba(16, 185, 129, 0.52);
      transform: translateY(-1px);
    }

    #send:active:not(:disabled) { transform: translateY(0); }

    #send:disabled {
      background: rgba(255, 255, 255, 0.09);
      color: rgba(255, 255, 255, 0.42);
      box-shadow: none;
      opacity: 1;
    }

    /* Status banner */
    #msg {
      margin: 14px 0 0;
      padding: 13px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
      display: none;
    }

    #msg.ok {
      display: block;
      border: 1px solid rgba(52, 211, 153, 0.38);
      background: rgba(16, 185, 129, 0.12);
      color: #a7f3d0;
    }

    #msg.err {
      display: block;
      border: 1px solid rgba(251, 113, 133, 0.42);
      background: rgba(244, 63, 94, 0.12);
      color: #fecdd3;
    }

    /* Floating jump-to-cart bar */
    #float-cart {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 11px 20px;
      border-radius: 999px;
      border: 1px solid rgba(52, 211, 153, 0.48);
      background: rgba(14, 14, 18, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65), 0 0 24px rgba(16, 185, 129, 0.25);
    }

    #float-cart .fc-total {
      font-family: var(--font-display);
      font-weight: 800;
      color: var(--emerald-light);
      font-variant-numeric: tabular-nums;
    }

    #float-cart[hidden],
    button[hidden],
    section[hidden] {
      display: none !important;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 18px 34px;
      text-align: center;
      font-size: 12px;
      color: rgba(196, 181, 253, 0.48);
    }

    @media (max-width: 440px) {
      .tile { min-height: 112px; padding: 14px; }
      .panel { padding: 16px; }
      .brand-sub { display: none; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="watermark" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo" role="img" aria-label="Haze &amp; Chill Café Logo"></span>
        <div class="brand-text">
          <span class="brand-name">Haze &amp; Chill</span>
          <span class="brand-sub">Café &amp; Gaming Lounge</span>
        </div>
      </div>
      <div class="table-pill"><span class="table-dot" aria-hidden="true"></span><span id="table">Tisch</span></div>
    </div>
  </header>

  <main>
    <div class="hero">
      <p class="eyebrow">Kassel · Innenstadt</p>
      <h1>Speisekarte</h1>
      <p class="hero-sub">Wähle deine Drinks &amp; Snacks — deine Bestellung geht direkt an die Theke.</p>
    </div>

    <div id="grid" role="list" aria-label="Kategorien"></div>

    <section id="products" hidden>
      <div class="cat-controls">
        <button id="back" type="button">← Kategorien</button>
        <div id="cat-strip" class="cat-strip" role="tablist" aria-label="Kategorien wechseln"></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title-wrap">
            <span id="category-icon" class="panel-icon" aria-hidden="true"></span>
            <h2 id="category"></h2>
          </div>
        </div>
        <div id="list"></div>
      </div>
    </section>

    <section id="cart-section" aria-label="Warenkorb">
      <div id="cart-panel" class="panel">
        <div class="panel-head">
          <div class="cart-head-left">
            <h2>Warenkorb</h2>
            <span id="cart-count" class="count-badge" hidden>0</span>
          </div>
          <b id="total">0,00 €</b>
        </div>
        <div id="basket"></div>
        <button id="send" type="button" disabled>Bestellung abschicken</button>
        <p id="msg" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer>Haze &amp; Chill Café · Kölnische Str. 12–14, 34117 Kassel · Täglich 17:00–02:00 Uhr</footer>

  <button id="float-cart" type="button" hidden>
    <span>Warenkorb (<span id="fc-count">0</span>)</span>
    <span id="fc-total" class="fc-total">0,00 €</span>
    <span aria-hidden="true">↓</span>
  </button>

  <script>
    const $ = id => document.getElementById(id);
    const [, , table, slot] = location.pathname.split('/');
    $('table').textContent = 'Tisch ' + table;

    const storage = 'hc-cart-' + table;
    let saved = {};
    try { saved = JSON.parse(sessionStorage.getItem(storage)) || {}; } catch {}

    let cart = saved.cart || {},
        key = saved.key,
        items = [],
        categories = [],
        active = '',
        busy = false,
        cartInView = false;

    const CAT_META = {
      'Alkoholfrei': {
        from: '#6ee7b7', to: '#14b8a6', glow: 'rgba(16,185,129,0.20)', border: 'rgba(52,211,153,0.48)', shadow: 'rgba(16,185,129,0.32)',
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 8 1.75 12.28a2 2 0 0 0 2 1.72h4.54a2 2 0 0 0 2-1.72L18 8"/><path d="M5 8h14"/><path d="M7 15a6.47 6.47 0 0 1 5 0 6.47 6.47 0 0 0 5 0"/><path d="m12 8 1-6h2"/></svg>'
      },
      'Alkoholisch': {
        from: '#e879f9', to: '#9333ea', glow: 'rgba(192,132,252,0.22)', border: 'rgba(216,180,254,0.48)', shadow: 'rgba(168,85,247,0.34)',
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22h8"/><path d="M12 11v11"/><path d="m19 3-7 8-7-8Z"/></svg>'
      },
      'Heißgetränke': {
        from: '#fbbf24', to: '#d97706', glow: 'rgba(245,158,11,0.20)', border: 'rgba(251,191,36,0.45)', shadow: 'rgba(217,119,6,0.32)',
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg>'
      },
      'Essen': {
        from: '#fb923c', to: '#ef4444', glow: 'rgba(251,146,60,0.20)', border: 'rgba(251,146,60,0.45)', shadow: 'rgba(239,68,68,0.30)',
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"/><path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"/><path d="m2.1 21.8 6.4-6.3"/><path d="m19 5-7 7"/></svg>'
      },
      'Snacks': {
        from: '#a855f7', to: '#ec4899', glow: 'rgba(236,72,153,0.20)', border: 'rgba(232,121,249,0.45)', shadow: 'rgba(168,85,247,0.34)',
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>'
      },
      'Specials': {
        from: '#38bdf8', to: '#a78bfa', glow: 'rgba(139,92,246,0.22)', border: 'rgba(167,139,250,0.48)', shadow: 'rgba(139,92,246,0.34)',
        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>'
      }
    };

    const FALLBACK_META = CAT_META['Specials'];
    const metaOf = cat => CAT_META[cat] || FALLBACK_META;

    function persist() {
      sessionStorage.setItem(storage, JSON.stringify({ cart, key }));
    }

    function money(c) {
      return (c / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
    }

    function tag(type, text, cls) {
      const el = document.createElement(type);
      if (text !== undefined && text !== null) el.textContent = text;
      if (cls) el.className = cls;
      return el;
    }

    function setMsg(text, kind) {
      const el = $('msg');
      el.textContent = text || '';
      el.className = text ? kind : '';
    }

    function adjust(id, delta) {
      if (busy) return;
      const n = Math.min(30, Math.max(0, (cart[id] || 0) + delta));
      if (n) cart[id] = n;
      else delete cart[id];
      key = null;
      persist();
      setMsg('', '');
      render();
    }

    function row(item, inBasket) {
      const qty = cart[item.id] || 0;
      const el = tag('div', '', 'row');

      const info = tag('div', '', 'row-info');
      info.append(tag('div', item.name, 'row-name'));

      const priceLine = tag('span', money(item.price), 'row-price');
      if (inBasket && qty > 1) {
        priceLine.append(tag('span', '· gesamt ' + money(item.price * qty), 'row-sub'));
      }
      info.append(priceLine);
      el.append(info);

      const step = tag('div', '', 'step' + (qty > 0 ? ' has-qty' : ''));
      for (const [symbol, delta] of [['−', -1], ['+', 1]]) {
        if (delta === 1) step.append(tag('span', String(qty), 'step-qty'));
        const btn = tag('button', symbol, delta > 0 ? 'step-plus' : 'step-minus');
        btn.type = 'button';
        btn.disabled = busy || (delta < 0 ? !qty : qty >= 30);
        btn.setAttribute('aria-label', item.name + (delta > 0 ? ' hinzufügen' : ' entfernen'));
        btn.onclick = () => adjust(item.id, delta);
        step.append(btn);
      }
      el.append(step);
      return el;
    }

    function applyMetaVars(el, m) {
      el.style.setProperty('--cat-from', m.from);
      el.style.setProperty('--cat-to', m.to);
      el.style.setProperty('--tile-glow', m.glow);
      el.style.setProperty('--tile-border', m.border);
      el.style.setProperty('--tile-shadow', m.shadow);
    }

    function renderGrid() {
      const grid = $('grid');
      grid.replaceChildren();
      categories.forEach(c => {
        const m = metaOf(c);
        const availCount = items.filter(i => i.available && i.category === c).length;
        const btn = tag('button', '', 'tile');
        btn.type = 'button';
        btn.setAttribute('role', 'listitem');
        applyMetaVars(btn, m);

        const top = tag('div', '', 'tile-top');
        const iconWrap = tag('span', '', 'tile-icon');
        iconWrap.innerHTML = m.svg;
        const arrow = tag('span', '↗', 'tile-arrow');
        arrow.setAttribute('aria-hidden', 'true');
        top.append(iconWrap, arrow);

        const meta = tag('div', '', 'tile-meta');
        meta.append(
          tag('span', c, 'tile-title'),
          tag('span', availCount === 0 ? 'Ausverkauft' : (availCount === 1 ? '1 Artikel' : availCount + ' Artikel'), 'tile-count')
        );

        btn.append(top, meta);
        btn.onclick = () => { active = c; render(); };
        grid.append(btn);
      });
    }

    function renderCatStrip() {
      const strip = $('cat-strip');
      strip.replaceChildren();
      categories.forEach(c => {
        const m = metaOf(c);
        const chip = tag('button', c, 'cat-chip' + (c === active ? ' active' : ''));
        chip.type = 'button';
        chip.setAttribute('role', 'tab');
        chip.setAttribute('aria-selected', String(c === active));
        applyMetaVars(chip, m);
        chip.onclick = () => { active = c; render(); };
        strip.append(chip);
      });
    }

    function render() {
      const selected = items.filter(i => cart[i.id]);
      const totalQty = selected.reduce((s, i) => s + cart[i.id], 0);
      const totalCents = selected.reduce((s, i) => s + i.price * cart[i.id], 0);

      $('grid').style.display = active ? 'none' : 'grid';
      $('products').hidden = !active;

      if (active) {
        const m = metaOf(active);
        $('category').textContent = active;
        const iconEl = $('category-icon');
        applyMetaVars(iconEl, m);
        iconEl.innerHTML = m.svg;
        renderCatStrip();

        const products = items.filter(i => i.available && i.category === active);
        $('list').replaceChildren(
          ...(products.length
            ? products.map(i => row(i, false))
            : [tag('p', 'In dieser Kategorie ist aktuell alles ausverkauft.', 'empty-text')])
        );
      }

      $('cart-panel').classList.toggle('has-items', selected.length > 0);
      $('cart-count').hidden = totalQty === 0;
      $('cart-count').textContent = String(totalQty);
      $('basket').replaceChildren(
        ...(selected.length
          ? selected.map(i => row(i, true))
          : [tag('p', 'Dein Warenkorb ist noch leer. Wähle oben eine Kategorie aus.', 'empty-text')])
      );
      $('total').textContent = money(totalCents);
      $('send').disabled = busy || !selected.length;
      $('send').textContent = busy ? 'Bestellung wird gesendet…' : 'Bestellung abschicken';

      $('fc-count').textContent = String(totalQty);
      $('fc-total').textContent = money(totalCents);
      $('float-cart').hidden = totalQty === 0 || cartInView;
    }

    $('back').onclick = () => { active = ''; render(); };
    $('float-cart').onclick = () => $('cart-section').scrollIntoView({ behavior: 'smooth', block: 'start' });

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(entries => {
        cartInView = entries[0].isIntersecting;
        const hasAny = Object.keys(cart).length > 0;
        $('float-cart').hidden = !hasAny || cartInView;
      }, { threshold: 0.2 }).observe($('cart-section'));
    }

    async function init() {
      const r = await fetch('/api/menu');
      if (!r.ok) throw Error();
      const data = await r.json();
      items = data.items;
      categories = data.categories;
      for (const id of Object.keys(cart)) {
        if (!items.some(i => String(i.id) === id && i.available)) {
          delete cart[id];
          key = null;
        }
      }
      persist();
      renderGrid();
      render();
    }

    $('send').onclick = async () => {
      if (busy) return;
      busy = true;
      render();
      key = key || Array.from(crypto.getRandomValues(new Uint8Array(16)), x => x.toString(16).padStart(2, '0')).join('');
      persist();
      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            table: +table,
            slot: +slot,
            key,
            cart,
            prices: Object.fromEntries(items.map(i => [i.id, i.price]))
          })
        });
        const data = await res.json();
        if (!res.ok) throw Error(typeof data === 'string' ? data : 'Bestellung fehlgeschlagen.');
        cart = {};
        key = null;
        persist();
        setMsg('Bestellung #' + data.number + ' ist an der Theke eingegangen. Wir bringen sie gleich an Tisch ' + table + '!', 'ok');
      } catch (e) {
        setMsg(e.message || 'Verbindung unterbrochen. Bitte versuche es erneut.', 'err');
      } finally {
        busy = false;
        render();
      }
    };

    init().catch(() => {
      setMsg('Speisekarte konnte nicht geladen werden. Bitte lade die Seite erneut.', 'err');
    });
  </script>
</body>
</html>
